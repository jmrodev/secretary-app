x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db-prod:
    image: mariadb:10.6
    restart: always
    container_name: secretary-db-prod
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD_PROD:-cima1255}
      MYSQL_DATABASE: ${DB_NAME_PROD:-clinical_management}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - ./mysql_data_prod:/var/lib/mysql
      - ./server/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "${DB_EXTERNAL_PORT_PROD:-3310}:3306"
    networks:
      - proxy-network
    healthcheck:
      test: "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"
      timeout: 20s
      retries: 10

  server-prod:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    restart: always
    container_name: secretary-server-prod
    logging: *default-logging
    ports:
      - "5001:5000"
    environment:
      - DB_HOST=db-prod
      - DB_USER=root
      - DB_PASSWORD=cima1255
      - DB_NAME=clinical_management
      - PORT=5000
      - TZ=America/Argentina/Buenos_Aires
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-supersecretkey123}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
    depends_on:
      db-prod:
        condition: service_healthy
    networks:
      - proxy-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  client-prod:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
    restart: always
    container_name: secretary-client-prod
    logging: *default-logging
    ports:
      - "8080:80"
    depends_on:
      - server-prod
    networks:
      - proxy-network

  # [MONITORING] Real-time log viewer
  dozzle:
    image: amir20/dozzle:latest
    container_name: secretary-logs
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8888:8080"
    environment:
      - DOZZLE_LEVEL=info
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
