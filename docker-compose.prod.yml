x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db-prod:
    image: mariadb:10.6
    restart: always
    container_name: secretary-db-prod
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD_PROD:?DB_ROOT_PASSWORD_PROD no definida en .env}
      MYSQL_DATABASE: ${DB_NAME_PROD:-clinical_management}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - ./data/database/prod:/var/lib/mysql
      - ./server/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - internal-network
    healthcheck:
      test: "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"
      timeout: 20s
      retries: 10

  server-prod:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    restart: always
    container_name: secretary-server-prod
    dns:
      - 8.8.8.8
      - 1.1.1.1
    logging: *default-logging
    ports:
      - "5001:5000"
    environment:
      - DB_HOST=db-prod
      - DB_USER=root
      - DB_PASSWORD=${DB_ROOT_PASSWORD_PROD:?DB_ROOT_PASSWORD_PROD no definida en .env}
      - DB_NAME=clinical_management
      - PORT=5000
      - TZ=America/Argentina/Buenos_Aires
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET no definida en .env}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - WHATSAPP_BRIDGE_URL=http://whatsapp-bridge:8090/api/send
      - WHATSAPP_BRIDGE_STATUS_URL=http://whatsapp-bridge:8090/api/status
      - WHATSAPP_BRIDGE_SECRET=${WHATSAPP_BRIDGE_SECRET:?WHATSAPP_BRIDGE_SECRET no definida en .env}
    depends_on:
      db-prod:
        condition: service_healthy
    networks:
      - internal-network
      - proxy-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  whatsapp-bridge:
    build: ./whatsapp-bridge-go
    restart: always
    container_name: secretary-whatsapp-bridge
    dns:
      - 8.8.8.8
      - 1.1.1.1
    logging: *default-logging
    networks:
      - internal-network
    volumes:
      - ./whatsapp-bridge-go/data:/app/data
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - WHATSAPP_WEBHOOK_URL=http://server-prod:5000/api/whatsapp/webhook
      - WHATSAPP_BRIDGE_SECRET=${WHATSAPP_BRIDGE_SECRET:?WHATSAPP_BRIDGE_SECRET no definida en .env}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  client-prod:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
    restart: always
    container_name: secretary-client-prod
    logging: *default-logging
    ports:
      - "8080:80"
    depends_on:
      - server-prod
    networks:
      - internal-network
      - proxy-network

  # [MONITORING] Real-time log viewer
  dozzle:
    image: amir20/dozzle:latest
    container_name: secretary-logs
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8888:8080"
    environment:
      - DOZZLE_LEVEL=info
    networks:
      - internal-network
      - proxy-network

networks:
  internal-network:
    driver: bridge
  proxy-network:
    external: true
    name: ${PROXY_NETWORK_NAME:-proxy-network}

