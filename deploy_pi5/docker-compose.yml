version: '3.8'

services:
  # Base de Datos
  db:
    image: mariadb:10.6
    restart: always
    container_name: secretary-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-cima1255}
      MYSQL_DATABASE: clinical_management
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ../server/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-cima1255}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend (Server)
  server:
    build:
      context: ../server
      dockerfile: Dockerfile.prod
    restart: always
    container_name: secretary-server
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-cima1255}
      - DB_NAME=clinical_management
      - PORT=5000
      - NODE_ENV=production
      - TZ=America/Argentina/Buenos_Aires
      - JWT_SECRET=${JWT_SECRET:-supersecretkey123}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Client)
  client:
    build:
      context: ../client
      dockerfile: Dockerfile.prod
    restart: always
    container_name: secretary-client
    depends_on:
      - server

  # Nginx Proxy Manager (Gestor de SSL y DuckDNS)
  app-proxy:
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    container_name: secretary-proxy
    ports:
      - '80:80'   # HTTP
      - '81:81'   # Panel de Administración
      - '443:443' # HTTPS
    volumes:
      - ./proxy/data:/data
      - ./proxy/letsencrypt:/etc/letsencrypt

networks:
  default:
    name: secretary-network
