x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mariadb:10.6
    restart: always
    container_name: secretary-db-dev
    command: --innodb-use-native-aio=OFF
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-cima1255}
      MYSQL_DATABASE: ${DB_NAME:-clinical_management}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - ./data/database/dev:/var/lib/mysql
      - ./server/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./server/02-dev-seed.sql:/docker-entrypoint-initdb.d/02-dev-seed.sql
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-cima1255}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  server:
    build: ./server
    restart: always
    container_name: secretary-app-server-1
    command: npm run dev
    logging: *default-logging
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=cima1255
      - DB_NAME=clinical_management
      - DB_PORT=3306
      - PORT=5000
      - NODE_ENV=development
      - DEBUG=afip-apis:*
      - TZ=America/Argentina/Buenos_Aires
      - JWT_SECRET=${JWT_SECRET:-supersecretkey123}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  client:
    build: ./client
    restart: always
    container_name: secretary-app-client-1
    logging: *default-logging
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=/api
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # [MONITORING] Real-time log viewer (Dev version)
  dozzle:
    image: amir20/dozzle:latest
    container_name: secretary-logs-dev
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8889:8080"
    environment:
      - DOZZLE_LEVEL=info
