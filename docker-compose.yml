services:
  db:
    image: mariadb:10.6
    restart: always
    container_name: secretary-db-dev
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-cima1255}
      MYSQL_DATABASE: ${DB_NAME:-clinical_management}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./server/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./server/02-dev-seed.sql:/docker-entrypoint-initdb.d/02-dev-seed.sql
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    healthcheck:
      test: "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"
      timeout: 20s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  server:
    build: ./server
    restart: always
    command: npm run dev
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=cima1255
      - DB_NAME=clinical_management
      - DB_PORT=3306
      - PORT=5000
      - TZ=America/Argentina/Buenos_Aires
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  client:
    build: ./client
    restart: always
    ports:
      - "5173:5173"

    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
