services:
  db:
    image: mariadb:10.6
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: cima1255
      MYSQL_DATABASE: clinical_management
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./server/database.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3307:3306" # Mapeo a 3307 para evitar conflicto con local si existe
    healthcheck:
      test: "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"
      timeout: 20s
      retries: 10

  server:
    build: ./server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=cima1255
      - DB_NAME=clinical_management
      - PORT=5000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build: ./client
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules
