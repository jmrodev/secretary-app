x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

networks:
  secretary_net:
    driver: bridge

services:
  db:
    image: mariadb:10.6
    restart: always
    container_name: secretary-db-dev
    command: --innodb-use-native-aio=OFF
    logging: *default-logging
    networks:
      - secretary_net
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-clinical_management}
      MYSQL_USER: ${DB_USER:-secretary_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./server/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./server/02-dev-seed.sql:/docker-entrypoint-initdb.d/02-dev-seed.sql
      - ./server/03-optimizations.sql:/docker-entrypoint-initdb.d/03-optimizations.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    restart: always
    container_name: secretary-app-server-1
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: pnpm run dev
    logging: *default-logging
    networks:
      - secretary_net
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER:-secretary_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-clinical_management}
      - DB_PORT=3306
      - PORT=5000
      - NODE_ENV=development
      - DEBUG=afip-apis:*
      - TZ=America/Argentina/Buenos_Aires
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - GEMINI_CLI_TRUST_WORKSPACE=true
      - WHATSAPP_BRIDGE_URL=http://whatsapp-bridge:8090/api/send
      - WHATSAPP_BRIDGE_STATUS_URL=http://whatsapp-bridge:8090/api/status
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build: ./client
    restart: always
    container_name: secretary-app-client-1
    command: sh -c "pnpm install --no-frozen-lockfile && pnpm run dev -- --host"
    logging: *default-logging
    networks:
      - secretary_net
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=/api
      - VITE_PROXY_TARGET=http://server:5000
      - CI=true
      - npm_config_confirm_modules_purge=false
      - npm_config_verify_deps_before_run=false
    volumes:
      - ./client:/app
      - /app/node_modules

  whatsapp-bridge:
    build: ./whatsapp-bridge-go
    restart: always
    container_name: secretary-whatsapp-bridge
    dns:
      - 8.8.8.8
      - 1.1.1.1
    logging: *default-logging
    networks:
      - secretary_net
    volumes:
      - ./whatsapp-bridge-go/data:/app/data
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - WHATSAPP_WEBHOOK_URL=http://server:5000/api/whatsapp/webhook

  dozzle:
    image: amir20/dozzle:latest
    container_name: secretary-logs-dev
    restart: always
    networks:
      - secretary_net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOZZLE_LEVEL=info
