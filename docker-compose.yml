x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mariadb:10.6
    restart: always
    container_name: secretary-db-dev
    command: --innodb-use-native-aio=OFF
    logging: *default-logging
    network_mode: host
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-cima1255}
      MYSQL_DATABASE: ${DB_NAME:-clinical_management}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./server/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./server/02-dev-seed.sql:/docker-entrypoint-initdb.d/02-dev-seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-cima1255}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    restart: always
    container_name: secretary-app-server-1
    command: pnpm run dev
    logging: *default-logging
    network_mode: host
    environment:
      - DB_HOST=127.0.0.1
      - DB_USER=root
      - DB_PASSWORD=cima1255
      - DB_NAME=clinical_management
      - DB_PORT=3306
      - PORT=5000
      - NODE_ENV=development
      - DEBUG=afip-apis:*
      - TZ=America/Argentina/Buenos_Aires
      - JWT_SECRET=${JWT_SECRET:-supersecretkey123}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_CLI_TRUST_WORKSPACE=true
      - WHATSAPP_BRIDGE_URL=http://127.0.0.1:8090/api/send
      - WHATSAPP_BRIDGE_STATUS_URL=http://127.0.0.1:8090/api/status
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build: ./client
    restart: always
    container_name: secretary-app-client-1
    logging: *default-logging
    network_mode: host
    environment:
      - VITE_API_URL=/api
    volumes:
      - ./client:/app
      - /app/node_modules

  whatsapp-bridge:
    build: ./whatsapp-bridge-go
    restart: always
    container_name: secretary-whatsapp-bridge
    logging: *default-logging
    network_mode: host
    volumes:
      - ./whatsapp-bridge-go/examplestore.db:/app/examplestore.db
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - WHATSAPP_WEBHOOK_URL=http://127.0.0.1:5000/api/whatsapp/webhook

  dozzle:
    image: amir20/dozzle:latest
    container_name: secretary-logs-dev
    restart: always
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOZZLE_LEVEL=info
