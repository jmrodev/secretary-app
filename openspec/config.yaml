schema: spec-driven

context: |
  Tech stack: React 19, Vite 8, Express v5, Go 1.25.0, SQLite, MariaDB/MySQL, pnpm monorepo
  Architecture: Atomic Design (client), MVC + Repository (server), Go whatsapp bridge
  Testing: Vitest + Testing Library (client), Jest + node-mocks-http (server), go test (bridge)
  Style: BEM (CSS Modules), ESLint, Stylelint, Oxlint, react-doctor
  Tools: graphify (codebase mapping & callflow visualization), CodeGraph (index present)

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
    tdd: true
    test_command: "pnpm --filter server test && pnpm --filter client test"
  verify:
    test_command: "pnpm --filter server test && pnpm --filter client test"
    build_command: "pnpm build"
    coverage_threshold: 80
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: true
  detected_at: "2026-08-30"
  runners:
    client:
      command: "pnpm --filter client test"
      framework: "Vitest"
    server:
      command: "pnpm --filter server test"
      framework: "Jest"
  layers:
    unit:
      available: true
      tool: "Vitest (client), Jest (server)"
    integration:
      available: true
      tool: "Testing Library (client), node-mocks-http (server)"
    e2e:
      available: false
      tool: "—"
  coverage:
    available: true
    commands:
      client: "pnpm --filter client test -- --coverage"
      server: "pnpm --filter server test -- --coverage"
  quality_tools:
    linter:
      available: true
      commands:
        - "pnpm lint (root — delegates to client + server)"
        - "oxlint (client fast lint)"
        - "stylelint (client CSS)"
    type_checker:
      available: false
      command: "—"
    formatter:
      available: true
      command: "pnpm --filter client lint:fix"
